[project]
name = "medtender-ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.34,<1",
    "pdfplumber>=0.11,<1",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7,<1",
    "pytesseract>=0.3,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
